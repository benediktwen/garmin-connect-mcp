[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garmin-connect-mcp"
version = "0.1.0"
description = "MCP server to access Garmin data"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv==1.2.2",
    "garminconnect==0.3.6",  # pinned: token format can change between releases
    "curl_cffi>=0.7.0",
    "requests==2.33.0",
    "mcp==1.29.0",  # pinned to deployed version; 2.x renames mcp.server.fastmcp
    "starlette>=1.0.1",
    "httpx>=0.27.0",
]

[project.scripts]
garmin-mcp = "garmin_mcp:main"
garmin-mcp-auth = "garmin_mcp.auth_cli:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.0",
    "pytest-timeout>=2.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_mcp"]